name: Release
# A pushed tag vX.Y builds everything from this repo and publishes a pre-release:
# kernel RPM, bazzite-bootc-loader, bootc image (:vX.Y) and disk image, update bundle for existing installs.
# It stays a draft until every part is attached. After a fix, start a fresh run (re-runs replay the old
# workflow file):  gh workflow run release.yml -f tag=vX.Y
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag, e.g. v2.3"
        required: true
      hosted:
        description: "build the kernel on GitHub's runner instead of the self-hosted one"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  meta:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.m.outputs.tag }}
    steps:
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --prerelease --verify-tag \
              --title "$TAG" --notes "Release notes follow."

  kernel:
    needs: meta
    # Gilles' PC (WSL, label ps5-kernel): more cores and a warm Docker cache. hosted=true when it's off.
    runs-on: ${{ inputs.hosted && 'ubuntu-24.04' || fromJSON('["self-hosted", "linux", "x64", "ps5-kernel"]') }}
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - name: Build
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then D=$HOME/ps5-ci-kernel; else D=$RUNNER_TEMP/ps5-build; fi
          # the builder leaves root-owned files; the previous build goes through Docker
          [ ! -d "$D" ] || docker run --rm -v "$(dirname "$D")":/p alpine rm -rf "/p/$(basename "$D")"
          REPO="$D" bash build.sh
          mkdir -p out && rm -f out/*.rpm && cp "$D"/linux-bin/linux-ps5-*.rpm out/
      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: gh release upload "$TAG" out/*.rpm --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-rpm
          path: out/*.rpm

  loader:
    needs: meta
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - run: sudo apt-get install -yq clang-18 lld-18 build-essential binutils xxd
      - name: Build and attach
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          bash loader/build.sh "$TAG"
          gh release upload "$TAG" loader/output/bazzite-bootc-loader-$TAG.elf \
            loader/output/bazzite-bootc-loader-$TAG.elf.sha256 --clobber

  image:
    needs: [meta, kernel]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/bootc-build-image.yml
    with:
      tag: ${{ needs.meta.outputs.tag }}
      stable: false
      kernel_artifact: kernel-rpm
    secrets: inherit

  bundle:
    needs: [meta, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.tag }}
      # the same kernel, initramfs and modules as the bootc image: both start from bazzite-deck + this kernel
      - name: Kernel parts from the bootc image
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ps5-bazzite-bootc:$TAG
          echo "${{ github.token }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman pull -q "$IMG"
          K=$(podman run --rm "$IMG" ls /usr/lib/modules)
          [ "$(echo "$K" | wc -l)" = 1 ] || { echo "expected one kernel, found: $K"; exit 1; }
          P=$RUNNER_TEMP/kp/parts; mkdir -p "$P/efi" "$P/modules" "$P/files"
          C=$(podman create "$IMG"); podman cp "$C:/usr/lib/modules/$K" "$P/modules/"; podman rm -q "$C"
          mv "$P/modules/$K/vmlinuz" "$P/efi/bzImage"; mv "$P/modules/$K/initramfs.img" "$P/efi/initrd.img"
          echo "options moal ps_mode=0" > "$P/files/ps5-iw620-modprobe.conf"; echo "$K" > "$P/KERNEL"
          tar -C "$RUNNER_TEMP/kp" -cJf "$RUNNER_TEMP/parts.tar.xz" parts
      - name: Bundle and attach
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          B="$RUNNER_TEMP/b" FROM_BUNDLE="$RUNNER_TEMP/parts.tar.xz" bash tools/make-update-bundle.sh "$TAG"
          gh release upload "$TAG" "$RUNNER_TEMP/b/output/ps5-bazzite-deck-$TAG-update.tar.xz" \
            "$RUNNER_TEMP/b/output/ps5-bazzite-deck-$TAG-update.tar.xz.sha256" --clobber

  disk:
    needs: [meta, image]
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/bootc-build-disk-image.yml
    with:
      release: ${{ needs.meta.outputs.tag }}

  publish:
    needs: [meta, kernel, loader, image, bundle, disk]
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_notes.py "${{ needs.meta.outputs.tag }}"
      - name: Publish as a pre-release
        if: needs.kernel.result == 'success' && needs.loader.result == 'success' && needs.bundle.result == 'success' && needs.disk.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.meta.outputs.tag }}" --draft=false --prerelease
      - name: Left as a draft
        if: needs.kernel.result != 'success' || needs.loader.result != 'success' || needs.bundle.result != 'success' || needs.disk.result != 'success'
        run: |
          echo "kernel=${{ needs.kernel.result }} loader=${{ needs.loader.result }} image=${{ needs.image.result }} bundle=${{ needs.bundle.result }} disk=${{ needs.disk.result }}"
          exit 1
      - name: Post to the bootc testing channel
        env:
          HOOK: ${{ secrets.DISCORD_BOOTC_WEBHOOK }}
          TAG: ${{ needs.meta.outputs.tag }}
          URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.meta.outputs.tag }}
        run: |
          [ -n "$HOOK" ] || exit 0
          jq -n --arg tag "$TAG" --arg u "$URL" --arg repo "$GITHUB_REPOSITORY" '
            {embeds: [{title: "New bootc release: \($tag)", url: $u, color: 3447003,
              description: "The disk image and `bazzite-bootc-loader-\($tag).elf` are attached to the release.\n\nNew install: extract the `.7z.001`, flash it with Rufus (DD mode), Balena Etcher or `dd`, start it with the loader.\nAlready on bootc: `sudo bootc upgrade`, then restart.\n\nReport results here with `sudo bootc status` and `ps5-report`.",
              footer: {text: "\($repo) • \($tag)"}}]}' |
            curl -sSf -H 'Content-Type: application/json' -d @- "$HOOK"
