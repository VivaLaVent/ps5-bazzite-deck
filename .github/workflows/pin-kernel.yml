name: Pin kernel
# A release promoted to stable (gh release edit vX.Y --prerelease=false --latest) becomes the kernel of
# the nightly :stable bootc image. Pre-releases never reach :stable this way.
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: "stable release whose kernel to pin, e.g. v2.5"
        required: true

jobs:
  pin:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'linux-ps5-*.rpm' --dir rpm ||
            { echo "$TAG has no kernel RPM, nothing to pin"; exit 0; }
          R=$(ls rpm/*.rpm); N=$(basename "$R")
          sed -i -e "s/^KERNEL_REPO=.*/KERNEL_REPO=$GITHUB_REPOSITORY/" -e "s/^KERNEL_TAG=.*/KERNEL_TAG=$TAG/" \
                 -e "s/^KERNEL_RPM=.*/KERNEL_RPM=$N/" -e "s/^KERNEL_SHA256=.*/KERNEL_SHA256=$(sha256sum "$R" | cut -d' ' -f1)/" bootc/pins.env
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet bootc/pins.env && { echo "pins unchanged"; exit 0; }
          git commit -qm "pins: kernel from $TAG" bootc/pins.env
          git pull -q --rebase && git push -q   # main may have moved since the checkout
