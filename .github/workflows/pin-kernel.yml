name: Pin kernel
# A release's kernel becomes the kernel of :beta when it is published as a pre-release (release.yml calls this),
# and of :stable and :beta when it is promoted (gh release edit vX.Y --prerelease=false --latest). Both images are
# rebuilt right after.
on:
  release:
    types: [released]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      channel:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "release whose kernel to pin, e.g. v2.6"
        required: true
      channel:
        description: "stable (pins :stable and :beta) or beta"
        default: stable

jobs:
  pin:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          CHANNEL: ${{ inputs.channel || 'stable' }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'linux-ps5-*.rpm' --dir rpm ||
            { echo "$TAG has no kernel RPM, nothing to pin"; exit 0; }
          R=$(ls rpm/*.rpm); N=$(basename "$R"); S=$(sha256sum "$R" | cut -d' ' -f1)
          pin() {
            sed -i -e "s|^$1KERNEL_REPO=.*|$1KERNEL_REPO=$GITHUB_REPOSITORY|" -e "s|^$1KERNEL_TAG=.*|$1KERNEL_TAG=$TAG|" \
                   -e "s|^$1KERNEL_RPM=.*|$1KERNEL_RPM=$N|" -e "s|^$1KERNEL_SHA256=.*|$1KERNEL_SHA256=$S|" bootc/pins.env
          }
          newer() { [ "$(printf '%s\n%s\n' "${1#v}" "${2#v}" | sort -V | tail -1)" = "${1#v}" ]; }
          . bootc/pins.env
          [ "$CHANNEL" = beta ] || pin ""
          if [ "$CHANNEL" = beta ] || newer "$TAG" "$BETA_KERNEL_TAG"; then pin BETA_; fi
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet bootc/pins.env; then echo "pins unchanged, no rebuild"; exit 0; fi
          git commit -qm "pins: $CHANNEL kernel from $TAG" bootc/pins.env
          git pull -q --rebase && git push -q
          gh workflow run bootc-build-image.yml --repo "$GITHUB_REPOSITORY" --ref main
          # the disk image was built while this was a pre-release, so its installs follow :beta: build it again,
          # now for :stable (same image, the workflow picks the channel from the release's state)
          [ "$CHANNEL" = beta ] || gh workflow run bootc-build-disk-image.yml --repo "$GITHUB_REPOSITORY" --ref main -f release="$TAG"
