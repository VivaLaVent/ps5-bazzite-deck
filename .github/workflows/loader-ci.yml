name: Loader CI

on:
  pull_request:
    paths: ['loader/**']
  push:
    branches-ignore: [main]
    paths: ['loader/**']

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get install -y clang-18 lld-18 build-essential binutils xxd
      - name: Build loader
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash loader/build.sh "${{ github.ref_name }}"
      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: ps5-linux-loader
          path: loader/output/*.elf
