name: Build bootc image
# Weekly and by hand (gh workflow run bootc-build-image.yml): :stable and :<date> from main with the kernel
# pinned in pins.env, so Bazzite's base updates come through; no kernel is built. Releases call it with theirs.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ""
      stable:
        type: boolean
        default: true
      kernel_artifact:
        type: string
        default: ""

env:
  IMAGE: ps5-bazzite-bootc

jobs:
  build:
    runs-on: ubuntu-24.04
    concurrency:
      group: image-${{ inputs.tag || github.ref }}
      cancel-in-progress: ${{ inputs.tag == '' }}
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: bootc
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0   # tags, for the deck version in the image
      - name: Test the boot partition sync
        run: bash tests/ps5-bootc-sync.sh
      - name: Kernel RPM from this release's build
        if: inputs.kernel_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.kernel_artifact }}
          path: bootc/kernel

      - name: Kernel RPM pinned in pins.env
        if: inputs.kernel_artifact == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./pins.env
          gh release download "$KERNEL_TAG" --repo "$KERNEL_REPO" --pattern "$KERNEL_RPM" --dir kernel
          echo "$KERNEL_SHA256  kernel/$KERNEL_RPM" | sha256sum -c

      - name: Build
        id: build
        run: |
          . ./pins.env; . ../loader/pins.env
          LOADER="$LOADER_REPO@${LOADER_COMMIT:0:12}+bls-$(cat ../loader/patches/*.patch | sha256sum | cut -c1-12)"
          REF=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE
          VERSION=$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER
          podman build --pull=newer --build-arg IMAGE_VERSION="$VERSION" --build-arg LOADER="$LOADER" \
            --build-arg DECK="$(git describe --tags --always)" -f Containerfile -t "$REF:stable" ..
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Push
        if: github.event_name != 'pull_request'
        id: push
        env:
          REF: ${{ steps.build.outputs.ref }}
          VERSION: ${{ steps.build.outputs.version }}
          TAG: ${{ inputs.tag }}
          STABLE: ${{ inputs.stable || inputs.tag == '' }}
        run: |
          echo "${{ github.token }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push --digestfile digest "$REF:stable" "$REF:${TAG:-${VERSION%%.*}}"
          # :beta is the same image for now; later it gets the newest pre-release kernel and the next Bazzite
          [ "$STABLE" != true ] || { podman push "$REF:stable"; podman push "$REF:stable" "$REF:beta"; }
          echo "digest=$(cat digest)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'

      # Consoles with the public key refuse unsigned images, so a key without a secret is an error.
      - name: Sign
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          REF: ${{ steps.build.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            [ ! -f system_files/etc/pki/containers/ps5-bazzite-bootc.pub ] || { echo "SIGNING_SECRET is missing"; exit 1; }
            echo "not signed: no SIGNING_SECRET"; exit 0
          fi
          echo "${{ github.token }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "$REF@$DIGEST"

      - name: Post to Discord
        if: github.event_name != 'pull_request' && inputs.tag == ''
        env:
          HOOK: ${{ secrets.DISCORD_BOOTC_WEBHOOK || secrets.DISCORD_TESTING_WEBHOOK }}
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.build.outputs.version }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$HOOK" ] || exit 0
          DECK=$(git describe --tags --always); . ./pins.env
          [ "$GITHUB_EVENT_NAME" = schedule ] && KIND="Weekly update" || KIND="Update"
          jq -n --arg v "$VERSION" --arg u "$URL" --arg deck "$DECK" --arg digest "$DIGEST" --arg repo "$GITHUB_REPOSITORY" \
                --arg kind "$KIND" --arg kernel "$KERNEL_TAG" '
            {embeds: [{title: "\($kind) for bootc: \($v)", url: $u, color: 3447003,
              description: "Bazzite\u0027s latest base updates, the kernel of \($kernel), and the PS5 files as of \($deck).\n\nOn the console: Steam\u0027s update button or `sudo bootc upgrade`, then restart and start with bazzite-bootc-loader.\nBack to the previous image: `sudo bootc rollback`, then power off and start with the loader.\n\nDigest `\($digest)`",
              footer: {text: "\($repo) • :stable"}}]}' |
            curl -sSf -H 'Content-Type: application/json' -d @- "$HOOK"
