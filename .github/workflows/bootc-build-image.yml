name: Build bootc image
# Weekly and by hand: :stable from the stable release's tag and :beta from main, kernels pinned in main's pins.env.
# Releases call it with their own kernel and push :<tag>.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ""
      kernel_artifact:
        type: string
        default: ""

env:
  IMAGE: ps5-bazzite-bootc

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(inputs.tag == '' && '["stable","beta"]' || '["release"]') }}
    concurrency:
      group: image-${{ inputs.tag || github.ref }}-${{ matrix.channel }}
      cancel-in-progress: ${{ inputs.tag == '' }}
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: bootc
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Stable from the stable release
        if: inputs.tag == '' && matrix.channel == 'stable'
        run: |
          cp pins.env "$RUNNER_TEMP/pins.env"
          . ./pins.env
          git checkout -q "$KERNEL_TAG"
          cp "$RUNNER_TEMP/pins.env" pins.env
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - name: Test the boot partition sync
        run: bash tests/ps5-bootc-sync.sh
      - name: Kernel RPM from this release's build
        if: inputs.kernel_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.kernel_artifact }}
          path: bootc/kernel

      - name: Kernel RPM pinned in pins.env
        if: inputs.kernel_artifact == ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          . ./pins.env
          if [ "$CHANNEL" = beta ]; then
            KERNEL_REPO=$BETA_KERNEL_REPO KERNEL_TAG=$BETA_KERNEL_TAG KERNEL_RPM=$BETA_KERNEL_RPM KERNEL_SHA256=$BETA_KERNEL_SHA256
          fi
          gh release download "$KERNEL_TAG" --repo "$KERNEL_REPO" --pattern "$KERNEL_RPM" --dir kernel
          echo "$KERNEL_SHA256  kernel/$KERNEL_RPM" | sha256sum -c
          echo "KERNEL_FROM=$KERNEL_TAG" >> "$GITHUB_ENV"

      - name: Build
        id: build
        run: |
          . ../loader/pins.env
          LOADER="$LOADER_REPO@${LOADER_COMMIT:0:12}+$(cat ../loader/patches/*.patch | sha256sum | cut -c1-12)"
          REF=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE
          VERSION=$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER
          podman build --pull=newer --build-arg IMAGE_VERSION="$VERSION" --build-arg LOADER="$LOADER" \
            --build-arg DECK="$(git describe --tags --always)" -f Containerfile -t "$REF:build" ..
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Push
        if: github.event_name != 'pull_request'
        id: push
        env:
          REF: ${{ steps.build.outputs.ref }}
          VERSION: ${{ steps.build.outputs.version }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          echo "${{ github.token }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [ "$CHANNEL" = release ]; then
            podman push --digestfile digest "$REF:build" "$REF:$TAG"
          else
            podman push --digestfile digest "$REF:build" "$REF:$CHANNEL"
            podman push "$REF:build" "$REF:$CHANNEL-${VERSION%%.*}"
          fi
          echo "digest=$(cat digest)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'

      # consoles with the public key refuse unsigned images
      - name: Sign
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          REF: ${{ steps.build.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            [ ! -f system_files/etc/pki/containers/ps5-bazzite-bootc.pub ] || { echo "SIGNING_SECRET is missing"; exit 1; }
            echo "not signed: no SIGNING_SECRET"; exit 0
          fi
          echo "${{ github.token }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          # consoles check the key only (policy.json has no Rekor key): no transparency log, so sigstore can't block a build
          for i in 1 2 3; do
            cosign sign -y --tlog-upload=false --key env://COSIGN_PRIVATE_KEY "$REF@$DIGEST" && exit 0
            sleep $((i * 30))
          done
          exit 1

      - name: Post to Discord
        if: github.event_name != 'pull_request' && matrix.channel != 'release'
        env:
          HOOK: ${{ secrets.DISCORD_BOOTC_WEBHOOK }}
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.build.outputs.version }}
          CHANNEL: ${{ matrix.channel }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$HOOK" ] || exit 0
          DECK=$(git describe --tags --always)
          [ "$GITHUB_EVENT_NAME" = schedule ] && KIND="Weekly update" || KIND="Update"
          [ "$CHANNEL" = beta ] && LABEL=Beta || LABEL=Stable
          jq -n --arg v "$VERSION" --arg u "$URL" --arg deck "$DECK" --arg digest "$DIGEST" --arg repo "$GITHUB_REPOSITORY" \
                --arg kind "$KIND" --arg kernel "$KERNEL_FROM" --arg label "$LABEL" --arg ch "$CHANNEL" '
            {embeds: [{title: "\($kind) for bootc \($label): \($v)", url: $u, color: 3447003,
              description: "Bazzite\u0027s latest base updates, the kernel of \($kernel), and the PS5 files as of \($deck).\n\nOn the console: `sudo bootc upgrade`, then restart and start with bazzite-bootc-loader.\nBack to the previous image: `sudo bootc rollback`, then power off and start with the loader.\n\nDigest `\($digest)`",
              footer: {text: "\($repo) • :\($ch)"}}]}' |
            curl -sSf -H 'Content-Type: application/json' -d @- "$HOOK"
