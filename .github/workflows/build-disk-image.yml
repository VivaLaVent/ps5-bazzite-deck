name: Build disk image
# Turns ghcr.io/<owner>/ps5-bazzite-bootc:stable into a flashable .img and publishes it as a
# pre-release (discord-release.yml announces it). Manual for now; weekly once it's proven.
on:
  workflow_dispatch:

jobs:
  disk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - name: Pull image
        id: img
        run: |
          REF=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ps5-bazzite-bootc:stable
          sudo podman pull "$REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "tag=v$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - name: bootc-image-builder
        run: |
          mkdir out
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            -v "$PWD/bib/config.toml:/config.toml:ro" -v "$PWD/out:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type raw --rootfs ext4 --use-librepo=True "${{ steps.img.outputs.ref }}"

      - name: Prepare the boot partition for the PS5 loader
        run: |
          sudo apt-get install -yq dosfstools
          sudo tools/finish-disk-image.sh out/image/disk.raw

      - name: Compress
        run: |
          N=ps5-bazzite-bootc-${{ steps.img.outputs.tag }}.img
          sudo mv out/image/disk.raw "out/$N"
          cd out && 7z a -v1900m -mx=5 "$N.7z" "$N" >/dev/null && sha256sum "$N".7z.* > SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Disk image of \`${{ steps.img.outputs.ref }}\`.

          ## Installing
          Extract the .7z parts, flash the .img to a USB drive (32 GB or more) with Rufus or dd,
          start the PS5 Linux loader as usual. Login: ps5 / ps5.

          ## Updating
          \`sudo bootc upgrade\`, then restart. To undo an update: \`sudo bootc rollback\`.
          EOF
          gh release create "${{ steps.img.outputs.tag }}" out/*.7z.* out/SHA256SUMS \
            --prerelease --title "PS5 Bazzite bootc ${{ steps.img.outputs.tag }}" --notes-file notes.md
