[[customizations.user]]
# same login as the deck image
name = "ps5"
password = "ps5"
groups = ["wheel"]

# bootc raw images take the root size from customizations.disk (customizations.filesystem is "not
# supported"). The 6.4 GB of layers unpack to about 25 GiB; ps5-grow-root fills the drive at first start.
[[customizations.disk.partitions]]
type = "plain"
mountpoint = "/"
fs_type = "ext4"
minsize = "32 GiB"
