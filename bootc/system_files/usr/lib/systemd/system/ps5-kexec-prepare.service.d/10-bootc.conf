[Unit]
# With an update staged, the boot partition still holds the old deployment until
# shutdown has finished: reboot through the loader instead.
ConditionPathExists=!/run/ostree/staged-deployment

[Service]
# The same after "bootc rollback" or new kernel arguments: the boot partition is rewritten at shutdown,
# after this unit would have loaded its kernel.
ExecCondition=/usr/bin/ps5-bootc-sync --is-current
