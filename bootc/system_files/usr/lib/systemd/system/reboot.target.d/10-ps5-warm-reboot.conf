# Warm reboot into Linux (ps5-warm-reboot): ps5-reboot.service runs before systemd-reboot.service and ends in a kexec
# when a kernel is loaded, in a normal reboot otherwise. A drop-in, so systemd's own reboot.target keeps applying.
[Unit]
Requires=ps5-kexec-prepare.service ps5-reboot.service
After=ps5-reboot.service
