# Drop-in for the image builder's ps5-stage-firmware.service.
# The unit is ordered Before=systemd-modules-load.service (early boot) but, with
# default dependencies, also After=sysinit.target/basic.target (late boot). That is
# an ordering cycle; systemd breaks it by deleting a random job each boot
# (dbus-broker, NetworkManager, ...), so services go missing on some boots.
# Early-boot services must not use default dependencies.
[Unit]
DefaultDependencies=no
Conflicts=shutdown.target
Before=shutdown.target
