# A random scan MAC invalidates KDE's access-point list mid-scan, so GUI Wi-Fi joins fail.
[device]
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=permanent
wifi.powersave=2
# By hardware address: a client id from the machine id makes a fresh image look like a new device.
ipv4.dhcp-client-id=mac
