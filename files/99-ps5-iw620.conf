# IW620: a randomized scan MAC breaks GUI Wi-Fi joins; keep the permanent MAC, moderate power saving.
[device]
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=permanent
wifi.powersave=2
# Identify to DHCP by the hardware address, not by a client id derived from the machine id:
# a fresh image otherwise looks like a new device to the router and gets a new IP.
ipv4.dhcp-client-id=mac
